[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kitbag"
version = "0.1.0"
description = "Explore, install, batch & evaluate Claude Code plugins and MCP servers — with curated, shareable bundles."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "ostin-pil", email = "eduvamsterdam@gmail.com" }]
keywords = ["claude", "claude-code", "plugins", "mcp", "cli", "bundles"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
dependencies = ["PyYAML>=5.1"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4"]

[project.scripts]
kitbag = "kitbag.cli:main"

[project.urls]
Homepage = "https://github.com/ostin-pil/kitbag"
Repository = "https://github.com/ostin-pil/kitbag"
Issues = "https://github.com/ostin-pil/kitbag/issues"

[tool.setuptools]
packages = ["kitbag"]

[tool.setuptools.package-data]
kitbag = ["bundles.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["kitbag"]

[tool.coverage.report]
# main()/argparse wiring and the real network clone are covered via injection
# and live smoke, not unit tests; keep the gate below 100 with headroom.
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
