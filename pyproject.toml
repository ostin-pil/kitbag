[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kitbag"
version = "0.1.0"
description = "Explore, install, batch & evaluate Claude Code plugins and MCP servers — with curated, shareable bundles."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "kitbag authors", email = "eduvamsterdam@gmail.com" }]
keywords = ["claude", "claude-code", "plugins", "mcp", "cli", "bundles"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
dependencies = ["PyYAML>=5.1"]

[project.scripts]
kitbag = "kitbag.cli:main"

[project.urls]
Homepage = "https://github.com/your-org/kitbag"
Repository = "https://github.com/your-org/kitbag"
Issues = "https://github.com/your-org/kitbag/issues"

[tool.setuptools]
packages = ["kitbag"]

[tool.setuptools.package-data]
kitbag = ["bundles.yaml"]
