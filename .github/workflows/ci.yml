name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Create venv and install (with dev extras)
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Run tests
        run: .venv/bin/pytest -q

      - name: CLI smoke test
        run: |
          .venv/bin/kitbag --version
          .venv/bin/kitbag generate marketplace --dry-run
