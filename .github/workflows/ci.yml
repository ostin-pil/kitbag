name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Create venv and install (with dev extras)
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Run tests (with coverage gate)
        run: .venv/bin/pytest -q --cov=kitbag --cov-report=term-missing --cov-fail-under=78

      - name: CLI smoke test
        run: |
          .venv/bin/kitbag --version
          .venv/bin/kitbag generate marketplace --dry-run
